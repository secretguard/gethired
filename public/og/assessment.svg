<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Practical assessment">
  <!-- Source for assessment.png. Fonts: Outfit, Inter, JetBrains Mono (self-hosted in web/assets/fonts). Re-render at 1200x630 after editing. -->
  <defs>
    <style>@font-face{font-family:'Outfit';font-weight:100 900;src:url('outfit-var.woff2') format('woff2');}@font-face{font-family:'Inter';font-weight:100 900;src:url('inter-var.woff2') format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url('jetbrains-mono-var.woff2') format('woff2');}</style>
    <linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="fade"><rect x="0" y="0" width="1200" height="630" fill="url(#fg)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="#ffffff"/>
  <pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e2e8f0" stroke-width="1.5"/></pattern>
  <rect x="600" y="0" width="600" height="630" fill="url(#p)" mask="url(#fade)"/>
  <rect x="0" y="0" width="16" height="630" fill="#ff403d"/>
  <g class="illo" transform="translate(950,318) scale(0.92)">
    <circle r="215" fill="#ff403d" opacity="0.07"/><circle r="215" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(-190,-140)"><rect width="380" height="280" rx="14" fill="#ffffff" fill="none" stroke="#4b5568" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="40" x2="380" y2="40" stroke="#4b5568" stroke-width="3"/><circle cx="22" cy="20" r="6" fill="#4b5568"/><circle cx="42" cy="20" r="6" fill="#4b5568"/><circle cx="62" cy="20" r="6" fill="#4b5568"/><text x="22" y="78" text-anchor="start" font-family="JetBrains Mono" font-weight="600" font-size="22" fill="#12181f">$ run assessment</text><text x="22" y="112" text-anchor="start" font-family="JetBrains Mono" font-weight="600" font-size="22" fill="#12181f">[x] enumerate host</text><text x="22" y="146" text-anchor="start" font-family="JetBrains Mono" font-weight="600" font-size="22" fill="#12181f">[x] find the flaw</text><text x="22" y="180" text-anchor="start" font-family="JetBrains Mono" font-weight="600" font-size="22" fill="#ff403d">[ ] exploit it  ▌</text></g>
  </g>
  <text class="p" x="84" y="94" font-family="JetBrains Mono" font-weight="500" font-size="24" fill="#ff403d">gethired.sarathg.me/assessment</text>
  <text class="h" x="84" y="264" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#12181f">Practical</text>
  <text class="h" x="84" y="322" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#12181f">assessment</text>
  <text class="s" x="84" y="370" font-family="Inter" font-weight="400" font-size="26" fill="#4b5568">Prove what you can do on a live</text>
  <text class="s" x="84" y="406" font-family="Inter" font-weight="400" font-size="26" fill="#4b5568">target, not what you can recite.</text>
  <text class="f" x="84" y="560" font-family="Inter" font-weight="600" font-size="24" fill="#12181f">Sarath G</text>
  <text class="f" x="212" y="560" font-family="Inter" font-weight="400" font-size="24" fill="#4b5568">Cybersecurity consultant &amp; trainer</text>
