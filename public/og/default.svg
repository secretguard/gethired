    <circle cx="-100" cy="-105" r="14" fill="#ff403d"/><path d="M-107,-105 L-102,-100 L-92,-112" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="-70" y1="-105" x2="40" y2="-105" fill="none" stroke="#12181f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-100" cy="-43" r="14" fill="#ff403d"/><path d="M-107,-43 L-102,-38 L-92,-50" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="-70" y1="-43" x2="60" y2="-43" fill="none" stroke="#12181f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-100" cy="19" r="14" fill="#ff403d"/><path d="M-107,19 L-102,24 L-92,12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="-70" y1="19" x2="20" y2="19" fill="none" stroke="#12181f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-100" cy="81" r="14" fill="none" stroke="#4b5568" stroke-width="4"/><line x1="-70" y1="81" x2="55" y2="81" fill="none" stroke="#12181f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(120,110)"><circle r="60" fill="none" stroke="#ff403d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="43.199999999999996" y1="43.199999999999996" x2="87" y2="87" stroke="#ff403d" stroke-width="11" stroke-linecap="round"/></g>
