<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Your career roadmap">
  <!-- Source for roadmap.png. Fonts: Outfit, Inter, JetBrains Mono (self-hosted in web/assets/fonts). Re-render at 1200x630 after editing. -->
  <defs>
    <style>@font-face{font-family:'Outfit';font-weight:100 900;src:url('outfit-var.woff2') format('woff2');}@font-face{font-family:'Inter';font-weight:100 900;src:url('inter-var.woff2') format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:100 900;src:url('jetbrains-mono-var.woff2') format('woff2');}</style>
    <linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="fade"><rect x="0" y="0" width="1200" height="630" fill="url(#fg)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="#ffffff"/>
  <pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e2e8f0" stroke-width="1.5"/></pattern>
  <rect x="600" y="0" width="600" height="630" fill="url(#p)" mask="url(#fade)"/>
  <rect x="0" y="0" width="16" height="630" fill="#ff403d"/>
  <g class="illo" transform="translate(950,318) scale(0.92)">
    <circle r="215" fill="#ff403d" opacity="0.07"/><circle r="215" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="-120" y1="-150" x2="-120" y2="150" fill="none" stroke="#4b5568" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-120" cy="-130" r="22" fill="#ff403d" fill="none" stroke="#ff403d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="-120" y="-121" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="24" fill="#ffffff">1</text><line x1="-70" y1="-130" x2="100" y2="-130" fill="none" stroke="#12181f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-120" cy="-43" r="22" fill="#ff403d" fill="none" stroke="#ff403d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="-120" y="-34" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="24" fill="#ffffff">2</text><line x1="-70" y1="-43" x2="160" y2="-43" fill="none" stroke="#12181f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-120" cy="44" r="22" fill="#ffffff" fill="none" stroke="#4b5568" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="-120" y="53" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="24" fill="#4b5568">3</text><line x1="-70" y1="44" x2="80" y2="44" fill="none" stroke="#4b5568" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-120" cy="131" r="22" fill="#ffffff" fill="none" stroke="#4b5568" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="-120" y="140" text-anchor="middle" font-family="JetBrains Mono" font-weight="600" font-size="24" fill="#4b5568">4</text><line x1="-70" y1="131" x2="140" y2="131" fill="none" stroke="#4b5568" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(150,140)"><line y1="0" y2="-90" fill="none" stroke="#ff403d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M0,-90 H70 L52,-66 L70,-42 H0 Z" fill="#ff403d"/></g>
  </g>
  <text class="p" x="84" y="94" font-family="JetBrains Mono" font-weight="500" font-size="24" fill="#ff403d">gethired.sarathg.me/roadmap</text>
  <text class="h" x="84" y="264" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#12181f">Your career</text>
  <text class="h" x="84" y="322" font-family="Outfit" font-weight="800" font-size="54" letter-spacing="-0.02em" fill="#12181f">roadmap</text>
  <text class="s" x="84" y="370" font-family="Inter" font-weight="400" font-size="26" fill="#4b5568">A sequenced plan built from</text>
  <text class="s" x="84" y="406" font-family="Inter" font-weight="400" font-size="26" fill="#4b5568">your gaps, not a generic checklist.</text>
  <text class="f" x="84" y="560" font-family="Inter" font-weight="600" font-size="24" fill="#12181f">Sarath G</text>
  <text class="f" x="212" y="560" font-family="Inter" font-weight="400" font-size="24" fill="#4b5568">Cybersecurity consultant &amp; trainer</text>
